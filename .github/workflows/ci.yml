name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-macos-build
        with:
          rust-targets: aarch64-apple-darwin
      - name: Frontend checks
        run: |
          pnpm check
          pnpm test
          pnpm build
      - name: Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - name: Release config checks
        run: |
          ruby -c distribution/homebrew/tasteful-intent.rb
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import yaml from "js-yaml";
          for (const file of [
            ".github/workflows/build-macos.yml",
            ".github/workflows/build-macos-mas.yml",
            ".github/workflows/homebrew-bump.yml",
            ".github/workflows/ci.yml",
          ]) {
            yaml.load(fs.readFileSync(file, "utf8"));
          }
          NODE
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')); if (c.productName !== 'TastefulIntent') process.exit(1)"
          ! grep -nE 'IntentMemo\.app|IntentMemo_|Intent[.% ]Memo_|Intent_Memo|Intent Memo|Intent-Memo|tkhwang/intent-memo' src-tauri/tauri.conf.json distribution/homebrew/tasteful-intent.rb .github/workflows/homebrew-bump.yml .github/workflows/build-macos-mas.yml
          ! grep -nE 'auto_updates|^[[:space:]]*zap ' distribution/homebrew/tasteful-intent.rb
      - name: Unsigned Tauri package smoke
        run: |
          pnpm tauri build --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
          APP_VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          test -d "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/TastefulIntent.app"
          test -f "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/TastefulIntent_${APP_VERSION}_aarch64.dmg"
