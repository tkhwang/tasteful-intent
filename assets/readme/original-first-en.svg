<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="280" viewBox="0 0 1200 280"
     role="img" aria-labelledby="title desc">
  <title id="title">Original-first structure</title>
  <desc id="desc">You write your thinking and intent down; it becomes the Markdown original you own. You write and own your intent as local Markdown, use it with an external AI, then open the resulting Markdown folders without replacing the original.</desc>

  <rect width="1200" height="280" rx="24" fill="#F4EEE2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">

    <!-- card 1: human thought -->
    <g transform="translate(84 82)">
      <rect width="264" height="116" rx="12" fill="#FCF8F0" stroke="#E3DACA" stroke-width="1.5"/>
      <g transform="translate(26 30)" fill="none" stroke="#B5524A"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 18V5"/>
        <path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/>
        <path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/>
        <path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/>
        <path d="M18 18a4 4 0 0 0 2-7.464"/>
        <path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/>
        <path d="M6 18a4 4 0 0 1-2-7.464"/>
        <path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/>
      </g>
      <text x="62" y="50" font-size="23" font-weight="600" fill="#322F29">Your intent</text>
      <text x="62" y="84" font-size="18" fill="#97907F">still fuzzy thoughts</text>
    </g>

    <!-- arrow 1 -->
    <g stroke="#8F8875" stroke-width="2.5" fill="none" stroke-linecap="round">
      <line x1="362" y1="140" x2="442" y2="140"/>
      <path d="M432 132 L 444 140 L 432 148"/>
    </g>
    <text x="403" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#7E7767">write</text>

    <!-- card 2: markdown original (emphasized) -->
    <g transform="translate(458 62)">
      <rect width="300" height="156" rx="12" fill="#FCF8F0" stroke="#D9C6AE" stroke-width="1.5"/>
      <text x="28" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" letter-spacing="2" fill="#C1734B">SOURCE OF TRUTH</text>
      <g transform="translate(128 74) rotate(-2.5)">
        <text x="0" y="9" text-anchor="middle" font-size="25" font-weight="700" fill="#322F29">Markdown original</text>
        <path d="M112 -16 C 71 -36, -82 -33, -117 -9 C -140 9, -76 30, 11 27 C 76 24, 117 9, 106 -6"
              fill="none" stroke="#C1734B" stroke-width="4" stroke-linecap="round"/>
      </g>
      <text x="28" y="116" font-size="18" fill="#6B6355">local .md files you own</text>
      <text x="28" y="142" font-size="18" fill="#97907F">autosave · atomic writes</text>
    </g>

    <!-- arrow 2: the app opens Markdown produced with external AI tools -->
    <g stroke="#A99F8B" stroke-width="2.5" fill="none" stroke-linecap="round">
      <line x1="772" y1="140" x2="840" y2="140"/>
      <path d="M832 132 L 844 140 L 832 148"/>
    </g>
    <text x="806" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#7E7767">use with AI</text>

    <!-- card 3: current AI result folders -->
    <g transform="translate(856 82)">
      <rect width="284" height="116" rx="12" fill="#F3F6FA" stroke="#B8C8D9" stroke-width="1.5"/>
      <g transform="translate(22 30)" fill="none" stroke="#5878A0"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8V4H8"/>
        <rect x="4" y="8" width="16" height="12" rx="2"/>
        <path d="M2 14h2"/>
        <path d="M20 14h2"/>
        <path d="M15 13v2"/>
        <path d="M9 13v2"/>
      </g>
      <text x="58" y="50" font-size="23" font-weight="600" fill="#405E82">AI result folders</text>
      <text x="58" y="84" font-size="18" fill="#6F7F92">open · pin · edit Markdown</text>
    </g>
  </g>
</svg>
