<svg xmlns="http://www.w3.org/2000/svg"
     width="720" height="820" viewBox="0 0 720 820"
     role="img" aria-labelledby="title desc">
  <title id="title">원본 우선 흐름</title>
  <desc id="desc">나의 의도를 로컬 Markdown 원본으로 기록하고 AI에 활용한 뒤 결과 폴더를 별도로 연다.</desc>

  <rect width="720" height="820" rx="28" fill="#F4EEE2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <g transform="translate(48 48)">
      <rect width="624" height="164" rx="18" fill="#FCF8F0" stroke="#E3DACA" stroke-width="2"/>
      <rect width="10" height="164" rx="5" fill="#B5524A"/>
      <circle cx="66" cy="58" r="28" fill="#F1DDD7"/>
      <text x="66" y="67" text-anchor="middle" font-size="28" font-weight="700" fill="#B5524A">H</text>
      <text x="112" y="70" font-size="42" font-weight="700" fill="#322F29">나의 생각과 의도</text>
      <text x="112" y="118" font-size="27" fill="#7E7767">나의 언어로 기록한 생각과 취향</text>
    </g>

    <g transform="translate(0 224)" text-anchor="middle">
      <text x="360" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" fill="#7E7767">직접 기록</text>
      <path d="M360 48 V88 M348 76 L360 90 L372 76" fill="none" stroke="#8F8875" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(48 326)">
      <rect width="624" height="184" rx="18" fill="#FCF8F0" stroke="#C1734B" stroke-width="2"/>
      <text x="42" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="24" letter-spacing="2" fill="#C1734B">SOURCE OF TRUTH</text>
      <text x="42" y="105" font-size="42" font-weight="700" fill="#322F29">Markdown 원본</text>
      <text x="42" y="150" font-size="27" fill="#7E7767">로컬 파일 · 자동 저장 · 충돌 보호</text>
    </g>

    <g transform="translate(0 522)" text-anchor="middle">
      <text x="360" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" fill="#6F7F92">AI에 활용</text>
      <path d="M360 48 V88 M348 76 L360 90 L372 76" fill="none" stroke="#7897BA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(48 624)">
      <rect width="624" height="148" rx="18" fill="#F3F6FA" stroke="#9FB6D0" stroke-width="2"/>
      <rect width="10" height="148" rx="5" fill="#5878A0"/>
      <circle cx="66" cy="52" r="28" fill="#DFE9F4"/>
      <text x="66" y="61" text-anchor="middle" font-size="24" font-weight="700" fill="#5878A0">AI</text>
      <text x="112" y="64" font-size="40" font-weight="700" fill="#405E82">AI 결과 폴더</text>
      <text x="112" y="111" font-size="27" fill="#6F7F92">열기 · 고정 · Markdown 편집</text>
    </g>
  </g>
</svg>
