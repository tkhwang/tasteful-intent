[package]
name = "intent-memo"
version = "1.8.0"
description = "A Markdown memo editor for human intentions"
authors = ["Taekeun Hwang"]
edition = "2024"
license = "MIT"

[features]
default = ["tauri-plugin-updater"]
app-store = []

[lib]
name = "intent_memo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = { version = "2", optional = true }
trash = "5.2.6"
ignore = "0.4"

[dev-dependencies]
tempfile = "3.25.0"
